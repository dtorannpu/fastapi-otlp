name: ci.yml

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: python
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install tox
        run: uv tool install --python-preference only-managed --python 3.14 tox --with tox-uv

      - name: Format check
        run: tox -e format-check

      - name: Mypy
        run: tox -e type

      - name: test
        run: tox -e 3.14
