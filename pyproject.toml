[project]
name = "fastapi-otlp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "sqlalchemy[asyncio]==2.1.4",
    "sample",
    "python-dotenv==1.2.4",
    "opentelemetry-api==1.45.1",
    "opentelemetry-sdk==1.45.1",
    "opentelemetry-exporter-otlp-proto-http==1.45.1",
    "opentelemetry-instrumentation-sqlalchemy==0.66b1",
    "fastapi==0.143.0",
    "uvicorn[standard]==0.54.0",
    "sqlmodel==0.0.48",
    "psycopg[binary]==3.3.6",
    "opentelemetry-instrumentation-psycopg==0.66b1",
]

[dependency-groups]
test = [
    "pytest==9.1.1",
    "factory-boy==3.3.3",
    "pytest-asyncio==1.4.0",
    "aiosqlite==0.22.1",
]

lint = [
    "ruff==0.16.10",
]

type = [
    { include-group = "test" },
    "mypy==2.4.0",
]

dev = [
    { include-group = "lint" },
    { include-group = "type" },
    "alembic==1.20.0",
    "pre-commit==4.6.2",
]

[tool.uv]
exclude-newer = "1 days"

[tool.uv.sources]
sample = { workspace = true }

[tool.uv.workspace]
members = ["packages/*"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q -s --import-mode=importlib"
asyncio_mode = "auto"
testpaths = [
    "**/tests",
    "**/integration",
]

[tool.ruff]
line-length = 88
target-version = "py314"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "E501",
    "CPY001",  # copyright notice
    "COM812",  # conflicts with ruff format
    "D203",  # conflicts with D211
    "D213",  # conflicts with D212
    "D100",  # undocumented public module
    "D101",  # undocumented public class
    "D103",  # undocumented public function
    "D104",  # undocumented public package
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "D", "ANN", "PLR2004"]
"**/integration/**" = ["S101", "D", "ANN", "PLR2004"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.tox]
requires = ["tox>=4.19"]
env_list = ["format", "type", "3.14"]

[tool.tox.env.format]
runner = "uv-venv-lock-runner"
dependency_groups = ["lint"]
commands = [["ruff", "format", "."], ["ruff", "check", "--fix", "."]]

[tool.tox.env.format-check]
runner = "uv-venv-lock-runner"
dependency_groups = ["lint"]
commands = [["ruff", "format", "--check", "."], ["ruff", "check", "."]]

[tool.tox.env_run_base]
runner = "uv-venv-lock-runner"
dependency_groups = ["test"]
commands = [["pytest"]]

[tool.tox.env.type]
runner = "uv-venv-lock-runner"
dependency_groups = ["type"]
commands = [
    ["mypy", "src/"],
    ["mypy", "tests/"],
    ["mypy", "packages/sample/src"],
    ["mypy", "packages/sample/tests"]
]
